name: InfiniWake
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    MARKETING_VERSION: "1.1.6"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: com.azg.InfiniWake
targets:
  InfiniWake:
    type: application
    platform: macOS
    sources:
      - Sources/InfiniWake
      - path: Resources/AppIcon.icns
        buildPhase: resources
    entitlements:
      path: Resources/InfiniWake.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: InfiniWake
        CFBundleDisplayName: InfiniWake
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Владимир Языджи"
        ITSAppUsesNonExemptEncryption: false
        NSPrincipalClass: NSApplication
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: true
        ARCHS: "$(ARCHS_STANDARD)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8RRKKV98JS
        # Store-сборка: без лампы Caps Lock, helper и Accessibility (см. AppFlavor.swift, StoreStubs.swift)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE $(inherited)"
